---
synapse_fqdn: "{{ synapse_server_name }}"
synapse_ssl: letsencrypt
synapse_public_baseurl: "{{ 'http' if synapse_ssl == 'off' else 'https' }}://{{ synapse_fqdn }}/"
synapse_report_stats: false
synapse_enable_registration: false
synapse_registration_requires_email: false
synapse_email: {}
synapse_database_name: synapse
synapse_database_user: synapse
